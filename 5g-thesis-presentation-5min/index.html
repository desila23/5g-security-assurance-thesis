0000000001 0,14.950000000000001" fill="#4264d0" transform="translate(1091 447) scale(-1 1)"/><rect class="layer" data-min="0" data-max="99" data-final="true" id="f39" x="624" y="382" width="352" height="146" rx="16" fill="#f0f4ff" stroke="#c7d5fa" stroke-width="1.8"/><text class="layer" data-min="0" data-max="99" data-final="true" id="f40" x="800" y="437.54" font-family="Nimbus Sans" font-size="38" font-weight="700" fill="#4264d0" text-anchor="middle" xml:space="preserve"><tspan x="800" dy="0">Security</tspan><tspan x="800" dy="48.64">Assurance</tspan></text><text class="layer" data-min="0" data-max="99" data-final="true" id="f41" x="800" y="576.58" font-family="Nimbus Sans" font-size="26" font-weight="400" fill="#52627b" text-anchor="middle" xml:space="preserve"><tspan x="800" dy="0">Verifica se il requisito</tspan><tspan x="800" dy="33.28">è rispettato</tspan></text><text class="layer" data-min="0" data-max="99" data-final="true" id="f42" x="347" y="626.58" font-family="Nimbus Sans" font-size="26" font-weight="400" fill="#182536" text-anchor="middle" xml:space="preserve"><tspan x="347" dy="0">Comportamento previsto</tspan></text><text class="layer" data-min="0" data-max="99" data-final="true" id="f43" x="1253" y="626.58" font-family="Nimbus Sans" font-size="26" font-weight="400" fill="#182536" text-anchor="middle" xml:space="preserve"><tspan x="1253" dy="0">Comportamento reale</tspan></text></g></svg><template class="notes">La Security Assurance serve a verificare che un sistema rispetti effettivamente i requisiti di sicurezza. Definire un requisito non significa che il software lo implementi correttamente. Bisogna quindi confrontare il comportamento previsto con quello reale. Nel 5G le funzionalità sono realizzate da componenti software chiamate Network Functions, e il 3GPP ha definito le specifiche SCAS per verificarne la sicurezza.</template><template class="sources">https://www.etsi.org/deliver/etsi_ts/133500_133599/133518/18.00.00_60/ts_133518v180000p.pdf
https://github.com/desila23/5g-security-assurance-thesis/blob/TESI-LATEX/capitoli/02_capitolo.tex</template></section>

alse" id="f100" d="M950 573 l0 -104" fill="none" stroke="#4264d0" stroke-width="5.4"/><path class="layer" data-min="1" data-max="1" data-final="false" id="f101" d="M950 469 l60 0" fill="none" stroke="#4264d0" stroke-width="5.4"/><polygon class="layer" data-min="1" data-max="1" data-final="false" id="f102" points="0,6.3 10,6.3 10,0 20,9 10,18 10,11.700000000000001 0,11.700000000000001" fill="#4264d0" transform="translate(1010 460) "/><polygon class="layer" data-min="1" data-max="1" data-final="false" id="f103" points="0,6.3 140,6.3 140,0 150,9 140,18 140,11.700000000000001 0,11.700000000000001" fill="#278766" transform="translate(880 668) "/><text class="layer" data-min="1" data-max="1" data-final="false" id="f104" x="112" y="779.09" font-family="Nimbus Sans" font-size="23" font-weight="400" fill="#52627b" text-anchor="start" xml:space="preserve"><tspan x="112" dy="0">Esempio semplificato riportato nella tesi · cap. 2</tspan></text><text class="layer" data-min="2" data-max="2" data-final="true" id="f105" x="112" y="315.88" font-family="Nimbus Sans" font-size="36" font-weight="700" fill="#182536" text-anchor="start" xml:space="preserve"><tspan x="112" dy="0">Rappresentazione della regola</tspan></text><rect class="layer" data-min="2" data-max="2" data-final="true" id="f106" x="112" y="355" width="760" height="376" rx="16" fill="#ffffff" stroke="#d9e3ef" stroke-width="1.8"/><text class="layer" data-min="2" data-max="2" data-final="true" id="f107" x="136" y="408.56" font-family="DejaVu Sans Mono" font-size="32" font-weight="700" fill="#4264d0" text-anchor="start" xml:space="preserve"><tspan x="136" dy="0">SEQUENCE {</tspan></text><text class="layer" data-min="2" data-max="2" data-final="true" id="f108" x="136" y="450.24" font-family="DejaVu Sans Mono" font-size="28" font-weight="400" fill="#182536" text-anchor="start" xml:space="preserve"><tspan x="136" dy="0">  nrf.discovery.request AS request</tspan><tspan x="136" dy="35.84">  nrf.discovery.response AS response</tspan></text><text class="layer" data-min="2" data-max="2" data-final="true" id="f109" x="136" y="528.56" font-family="DejaVu Sans Mono" font-size="32" font-weight="700" fill="#4264d0" text-anchor="start" xml:space="preserve"><tspan x="136" dy="0">}</tspan></text><text class="layer" data-min="2" data-max="2" data-final="true" id="f110" x="136" y="679.9" font-family="DejaVu Sans Mono" font-size="30" font-weight="700" fill="#278766" text-anchor="start" xml:space="preserve"><tspan x="136" dy="0">REQUIRE response.status == 403</tspan></text><polygon class="layer" data-min="2" data-max="2" data-final="true" id="f111" points="0,6.3 140,6.3 140,0 150,9 140,18 140,11.700000000000001 0,11.700000000000001" fill="#4264d0" transform="translate(1030 460) scale(-1 1)"/><polygon class="layer" data-min="2" data-max="2" data-final="true" id="f112" points="0,6.3 140,6.3 140,0 150,9 140,18 140,11.700000000000001 0,11.700000000000001" fill="#278766" transform="translate(1030 668) scale(-1 1)"/><text class="layer" data-min="2" data-max="2" data-final="true" id="f113" x="112" y="779.09" font-family="Nimbus Sans" font-size="23" font-weight="400" fill="#52627b" text-anchor="start" xml:space="preserve"><tspan x="112" dy="0">Sintassi reale del progetto</tspan></text><rect class="layer" data-min="1" data-max="2" data-final="true" id="f114" x="1050" y="405" width="438" height="128" rx="14" fill="#f0f4ff" stroke="#4264d0" stroke-width="1.8"/><text class="layer" data-min="1" data-max="2" data-final="true" id="f115" x="1269" y="460.88" font-family="Nimbus Sans" font-size="36" font-weight="700" fill="#4264d0" text-anchor="middle" xml:space="preserve"><tspan x="1269" dy="0">Quali messaggi</tspan><tspan x="1269" dy="46.08">cercare?</tspan></text><rect class="layer" data-min="1" data-max="2" data-final="true" id="f116" x="1050" y="613" width="438" height="128" rx="14" fill="#eef8f3" stroke="#278766" stroke-width="1.8"/><text class="layer" data-min="1" data-max="2" data-final="true" id="f117" x="1269" y="667.88" font-family="Nimbus Sans" font-size="36" font-weight="700" fill="#278766" text-anchor="middle" xml:space="preserve"><tspan x="1269" dy="0">Quali criteri</tspan><tspan x="1269" dy="46.08">verificare?</tspan></text></svg><template class="notes">Il primo contributo è il DSL progettato. Le specifiche SCAS sono scritte in linguaggio naturale e non possono essere interpretate direttamente dal verificatore. La prima schermata mostra tre estratti reali e uno pseudocodice soltanto illustrativo. [Primo clic] Nel caso NRF, riportato in forma semplificata nella tesi, distinguiamo i messaggi da individuare e il criterio da verificare: la risposta HTTP 403 alla discovery non autorizzata. [Secondo clic] Ho progettato il DSL per rappresentare questi due aspetti con costrutti riutilizzabili. Al posto del testo SCAS compare la regola: SEQUENCE descrive i messaggi, REQUIRE il criterio. Le due domande rimangono le stesse. Le regole sono scritte usando i costrutti del DSL: non ho sviluppato una traduzione automatica NLP né un sistema che esegue i test SCAS.</template><template class="sources">https://www.etsi.org/deliver/etsi_ts/133500_133599/133512/17.03.00_60/ts_133512v170300p.pdf (p. 9)
https://www.etsi.org/deliver/etsi_ts/133500_133599/133518/18.00.00_60/ts_133518v180000p.pdf (p. 8)
https://www.etsi.org/deliver/etsi_ts/133500_133599/133514/16.03.00_60/ts_133514v160300p.pdf (p. 8)
https://github.com/desila23/5g-security-assurance-thesis/blob/TESI-LATEX/capitoli/02_capitolo.tex
https://github.com/desila23/5g-security-assurance-thesis/blob/main/dsl/nrf_sequence_test.dsl</template></section>

xt class="layer" data-min="0" data-max="99" data-final="true" id="f188" x="884" y="306.07" font-family="Nimbus Sans" font-size="29" font-weight="700" fill="#182536" text-anchor="start" xml:space="preserve"><tspan x="884" dy="0">Esempi di tre mutazioni</tspan></text><g class="layer" data-min="0" data-max="99" data-final="true" id="f189"><rect x="884" y="340" width="260" height="54" fill="#f0f4ff" stroke="#d9e3ef" stroke-width="1.5"/><text  x="902" y="374.59" font-family="Nimbus Sans" font-size="23" font-weight="700" fill="#182536" text-anchor="start" xml:space="preserve"><tspan x="902" dy="0">Mutazione</tspan></text><rect x="1144" y="340" width="142" height="54" fill="#f0f4ff" stroke="#d9e3ef" stroke-width="1.5"/><text  x="1215" y="374.59" font-family="Nimbus Sans" font-size="23" font-weight="700" fill="#182536" text-anchor="middle" xml:space="preserve"><tspan x="1215" dy="0">Originale</tspan></text><rect x="1286" y="340" width="202" height="54" fill="#f0f4ff" stroke="#d9e3ef" stroke-width="1.5"/><text  x="1387" y="374.59" font-family="Nimbus Sans" font-size="23" font-weight="700" fill="#182536" text-anchor="middle" xml:space="preserve"><tspan x="1387" dy="0">Mutato</tspan></text><rect x="884" y="394" width="260" height="92" fill="#ffffff" stroke="#d9e3ef" stroke-width="1.5"/><text  x="902" y="432.86999999999995" font-family="Nimbus Sans" font-size="23" font-weight="400" fill="#182536" text-anchor="start" xml:space="preserve"><tspan x="902" dy="0">NRF: HTTP</tspan><tspan x="902" dy="29.44">200 → 403</tspan></text><rect x="1144" y="394" width="142" height="92" fill="#ffffff" stroke="#d9e3ef" stroke-width="1.5"/><text  x="1215" y="447.59" font-family="Nimbus Sans" font-size="23" font-weight="700" fill="#b64b56" text-anchor="middle" xml:space="preserve"><tspan x="1215" dy="0">FAIL</tspan></text><rect x="1286" y="394" width="202" height="92" fill="#ffffff" stroke="#d9e3ef" stroke-width="1.5"/><text  x="1387" y="447.59" font-family="Nimbus Sans" font-size="23" font-weight="700" fill="#278766" text-anchor="middle" xml:space="preserve"><tspan x="1387" dy="0">PASS</tspan></text><rect x="884" y="486" width="260" height="116" fill="#ffffff" stroke="#d9e3ef" stroke-width="1.5"/><text  x="902" y="522.15" font-family="Nimbus Sans" font-size="23" font-weight="400" fill="#182536" text-anchor="start" xml:space="preserve"><tspan x="902" dy="0">AMF A: Intervallo</tspan><tspan x="902" dy="29.44">temporale non</tspan><tspan x="902" dy="29.44">rispettato</tspan></text><rect x="1144" y="486" width="142" height="116" fill="#ffffff" stroke="#d9e3ef" stroke-width="1.5"/><text  x="1215" y="551.59" font-family="Nimbus Sans" font-size="23" font-weight="700" fill="#278766" text-anchor="middle" xml:space="preserve"><tspan x="1215" dy="0">PASS</tspan></text><rect x="1286" y="486" width="202" height="116" fill="#ffffff" stroke="#d9e3ef" stroke-width="1.5"/><text  x="1387" y="551.59" font-family="Nimbus Sans" font-size="23" font-weight="700" fill="#b64b56" text-anchor="middle" xml:space="preserve"><tspan x="1387" dy="0">FAIL</tspan></text><rect x="884" y="602" width="260" height="92" fill="#ffffff" stroke="#d9e3ef" stroke-width="1.5"/><text  x="902" y="640.87" font-family="Nimbus Sans" font-size="23" font-weight="400" fill="#182536" text-anchor="start" xml:space="preserve"><tspan x="902" dy="0">UPF: F-TEID</tspan><tspan x="902" dy="29.44">rimossi</tspan></text><rect x="1144" y="602" width="142" height="92" fill="#ffffff" stroke="#d9e3ef" stroke-width="1.5"/><text  x="1215" y="655.59" font-family="Nimbus Sans" font-size="23" font-weight="700" fill="#278766" text-anchor="middle" xml:space="preserve"><tspan x="1215" dy="0">PASS</tspan></text><rect x="1286" y="602" width="202" height="92" fill="#ffffff" stroke="#d9e3ef" stroke-width="1.5"/><text  x="1387" y="654.93" font-family="Nimbus Sans" font-size="21" font-weight="700" fill="#9d7139" text-anchor="middle" xml:space="preserve"><tspan x="1387" dy="0">INCONCLUSIVE</tspan></text></g><text class="layer" data-min="0" data-max="99" data-final="true" id="f190" x="989" y="797.1" font-family="Nimbus Sans" font-size="70" font-weight="700" fill="#4264d0" text-anchor="middle" xml:space="preserve"><tspan x="989" dy="0">13/13</tspan></text><text class="layer" data-min="0" data-max="99" data-final="true" id="f191" x="1299" y="769.24" font-family="Nimbus Sans" font-size="28" font-weight="700" fill="#182536" text-anchor="middle" xml:space="preserve"><tspan x="1299" dy="0">scenari completati</tspan><tspan x="1299" dy="35.84">con verdetto atteso</tspan></text></svg><template class="notes">[Tre fasi con due clic: A baseline, B generazione della PCAP mutata dal motore, C verifica della mutazione. Gli esempi a destra restano sempre visibili. DSL e pipeline sono in evidenza nelle fasi A e C.] Per valutare la sensibilità del sistema ho introdotto modifiche controllate nelle catture. Il mutatore è separato dalla pipeline: riceve la PCAP originale e le evidenze del report baseline, individua i dati da modificare e produce la PCAP mutata. Questa torna nello stesso sistema di verifica, con la stessa DSL. Il confronto dei risultati deve corrispondere alla modifica introdotta. Nei 13 scenari completati ho ottenuto tutti i verdetti attesi. Gli esempi mostrano il cambio di stato NRF da HTTP 200 a 403, la violazione dell’intervallo temporale nel caso AMF A e la rimozione degli F-TEID disponibili per la verifica UPF. In quest’ultimo esperimento sono state rimosse le risposte PFCP rilevanti, producendo INCONCLUSIVE.</template><template class="sources">https://github.com/desila23/5g-security-assurance-thesis/blob/gh-pages/5g-thesis-presentation/slides/19-mutazioni.html
https://github.com/desila23/5g-security-assurance-thesis/blob/TESI-LATEX/capitoli/06_capitolo.tex
https://github.com/desila23/5g-security-assurance-thesis/blob/main/mutation_testing/mutate_nrf_status.py</template></section></div></main><nav aria-label="Controlli presentazione"><button id="prev" aria-label="Slide precedente">←</button><span id="counter" aria-live="polite"></span><button id="next" aria-label="Slide successiva">→</button><button id="fullscreen">Schermo intero</button></nav><div id="progress"></div><dialog id="note-dialog"><h2 id="note-title"></h2><div id="note-text"></div><p id="note-sources"></p><button data-close>Chiudi</button></dialog><script>(()=>{'use strict';const slides=[...document.querySelectorAll('.slide')],total=slides.length,$=id=>document.getElementById(id);let index=0,stage=0;const max=()=>Number(slides[index].dataset.max);function resize(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1600,(innerHeight-(document.fullscreenElement?0:64))/900))}function render(){slides.forEach((s,i)=>{s.hidden=i!==index;s.querySelectorAll('.layer').forEach(e=>{e.classList.toggle('pending',Number(e.dataset.min)>stage||Number(e.dataset.max)<stage);const f=e.dataset.focus;const dim=Boolean(f&&!f.split(',').includes(String(stage)));e.classList.toggle('dimmed',dim);e.classList.toggle('selected',e.dataset.node==='true'&&!dim)})});$('counter').textContent=(index+1)+' / '+total+(max()?' · '+String.fromCharCode(65+stage):'');$('progress').style.width=((index+(max()?stage/max():0))/total*100)+'%';history.replaceState(null,'','#'+(index+1)+'-'+stage);$('note-title').textContent=slides[index].dataset.title;$('note-text').textContent=slides[index].querySelector('.notes').content.textContent;$('note-sources').textContent='Fonti: '+slides[index].querySelector('.sources').content.textContent;}
function next(){if(stage<max())stage++;else if(index<total-1){index++;stage=0}render()}function prev(){if(stage>0)stage--;else if(index>0){index--;stage=max()}render()}function go(i,end=false){index=Math.max(0,Math.min(total-1,i));stage=end?max():0;render()}function all(){stage=max();render()}function full(){if(document.fullscreenElement)document.exitFullscreen();else document.body.requestFullscreen().catch(()=>{})}$('next').onclick=next;$('prev').onclick=prev;$('fullscreen').onclick=full;$('deck').onclick=next;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||e.ctrlKey||e.metaKey||e.altKey)return;let ok=true;switch(e.key){case'ArrowRight':case' ':case'Enter':next();break;case'ArrowLeft':prev();break;case'PageDown':go(index+1);break;case'PageUp':go(index-1);break;case'Home':go(0);break;case'End':go(total-1,true);break;case'a':case'A':all();break;case'f':case'F':full();break;case'n':case'N':$('note-dialog').showModal();break;case'p':case'P':window.print();break;default:if(/^[1-7]$/.test(e.key))go(Number(e.key)-1);else ok=false}if(ok)e.preventDefault()});addEventListener('resize',resize);document.addEventListener('fullscreenchange',resize);const m=location.hash.match(/^#([1-7])(?:-(\d+))?$/);if(m){index=Number(m[1])-1;stage=Math.min(Number(m[2]||0),max())}resize();render();window.deckControl={next,prev,go,all,state:()=>({index,stage,max:max(),total})};})();</script></body></html>
