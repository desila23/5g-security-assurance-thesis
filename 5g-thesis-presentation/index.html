              <text x="112" y="257" font-family="Nimbus Sans" font-size="27" font-weight="400" fill="#65758b" text-anchor="start" class="svg-text fill-muted" xml:space="preserve">Le SCAS descrivono le condizioni della prova, le azioni e il comportamento atteso.</text>

          <template class="speaker-note">L'evoluzione delle reti mobili verso la quinta generazione ha introdotto un'architettura di rete più articolata rispetto alle precedenti. In particolare, il 5G *Core* (ossia il cuore della rete) è organizzato in diversi componenti, denominati *Network Functions*, ciascuno responsabile di specifiche funzionalità della rete. E queste funzioni cooperano tra loro attraverso lo scambio di messaggi e informazioni.
Tale organizzazione offre, da un lato, maggiora flessibilità, ma introduce anche nuove complessità dal punto di vista della sicurezza, perché non è sufficiente valutare il comportamento delle singole 
funzioni, ma bisogna considerare anche le loro interazioni.

Per supportare questa valutazione, il 3GPP ha definito le *Security Assurance Specification*, o *SCAS*, ossia specifiche tecniche che descrivono requisiti di sicurezza e procedure di test per le diverse funzioni della rete 5G.
In particolare, per ciascun caso di test vengono definite le condizioni iniziali, le operazioni da eseguire e i risultati attesi, oltre che quali evidenze raccogliere per documentare l'esecuzione della prova.

Schema parziale: gNB appartiene al RAN. AMF, SMF, AUSF, UDM e UPF appartengono al Core. UE e Internet sono terminale e rete dati esterni al Core. Il bus SBI è schematico. Le SCAS definiscono requisiti, procedure e risultati attesi.

Fonte tecnica: Bozza_Tesi_DeSantis_Samuele(1).pdf, §2.1–2.2.
Durata indicativa: 70 secondi.</template>

          <template class="speaker-note">Una volta eseguita una di queste prove è quindi necessario valutare se il comportamento osservato sia conforme a quanto previsto dalla specifica. Per farlo, possiamo disporre di un verdetto e di diverse evidenze, come log applicativi o catture di traffico di rete, ma la disponibilità di queste informazioni non implica necessariamente che sia immediato anche comprendere le motivazioni che hanno portato a quel verdetto.
Se pensiamo, ad esempio, a una cattura del traffico di rete, questa contiene al suo interno numerosi messaggi scambiati durante il test, ma la cattura, da sola, non dice esplicitamente quali messaggi siano rilevanti rispetto alla specifica, né quali condizioni sia state soddisfatte.

L'idea è quindi quella di rendere più esplicito e ricostruibile il legame tra il verdetto di una verifica e le evidenze che lo giustificano, mediante un report strutturato che, oltre all'esito, documenti i criteri applicati, le informazioni osservate e gli elementi della cattura che hanno contribuito a determinare quel risultato.

Esempio reale, riassunto in italiano: 3GPP TS 33.518 V17.0.0, §4.2.2.2.1, TC_DISC_AUTHORIZATION_SLICE_NRF. NF1 è nella slice B; NF2 permette discovery dalla slice A. NF1 cerca NF2 tramite NRF; risultato atteso HTTP 403 Forbidden. Precondizioni e passi sono abbreviati. Fonte: https://www.etsi.org/deliver/etsi_ts/133500_133599/133518/17.00.00_60/ts_133518v170000p.pdf

Fonte tecnica: Bozza_Tesi_DeSantis_Samuele(1).pdf, §3.1–3.2.

              <text x="112" y="257" font-family="Nimbus Sans" font-size="27" font-weight="400" fill="#65758b" text-anchor="start" class="svg-text fill-muted" xml:space="preserve">La pipeline interpreta quelle regole e produce un esito documentato sui messaggi osservati.</text>

          <template class="speaker-note">Per realizzare un sistema di questo tipo, però, bisogna affrontare un problema più generale.
*Come può un software sapere quali messaggi cercare, quali informazioni confrontare e quali condizioni verificare, se i criteri sono descritti prevalentemente in linguaggio naturale all'interno delle specifiche SCAS?*

Una possibile soluzione sarebbe sviluppare un programma specifico per ciascun test, implementanto direttamente nel codice la relativa logica di verifica; ma questo approccio legherebbe troppo il sistema al singolo test specifico con conseguenti problemi di forte accoppiamento e scarsa riusabilità.

Per rendere il sistema riutilizzabile, serve quindi separare i criteri, che possono cambiare da test a test, dalla logica software che si occupa di verificarli.
E proprio da questa necessità nasce l'idea centrale della lavoro: progettare un *DSL* (ossia *Domain Specific Language*) che permetta di esprimere in forma dichiarativa e strutturata i criteri ricavati dalle specifiche SCAS. L'aspetto fondamentale è che questo linguaggio non deve limitarsi a descrivere quali condizioni verificare, ma deve permettere anche di specificare quali evidenze individuare all'interno della cattura.
I criteri vengono quindi interpretati e formalizzati nella DSL, mentre il sistema software si occupa di applicare automaticamente le regole alle evidenze raccolte.

Il vantaggio di questa struttura è che possiamo definire verifiche per test differenti, purché supportati dal linguaggio, modificando le regole dichiarate nella DSL senza dover riscrivere ogni volta la logica generale del sistema.

Da questa idea derivano i due contributi principali che sono stati realizzati per questo lavoro: da una parte, la progettazione dell'effettivo linguaggio DSL; dall'altra, lo sviluppo di una pipeline software capace di interpretare le regole, analizzare le catture di traffico, individuare le evidenze rilevanti, verificarne le proprietà e produrre un report che documenti il verdetto e le motivazioni su cui si basa.

In questo modo, la DSL e la pipeline costituiscono un'unica soluzione integrata, pensata per rendere la verifica degli esiti SCAS automatizzabile, riutilizzabile e supportata da evidenze esplicite.

Fonte tecnica: Bozza_Tesi_DeSantis_Samuele(1).pdf, §3.2–3.4.
Durata indicativa: 65 secondi.</template>

          <template class="speaker-note">Il punto di partenza è quindi una o più catture di traffico in formato PCAP, che contengono i messaggi scambiati in rete durante la prova. Il problema è che queste catture possono contenere numerose informazioni, ma soltanto una parte di esse è effettivamente rilevante per il test che vogliamo verificare.
Per individuare queste informazioni, il sistema prevede due fasi distinte: 
- una prima fase di estrazione e normalizzazione per protocollo 
- e una seconda fase di selezione delle evidenze guidata dalla DSL.

La scelta di separare queste due fasi nasce proprio dall'obiettivo di rendere il sistema il più possibile riutilizzabile.
Infatti, ogni test SCAS prevede criteri di verifica specifici, ma utilizza uno o più protocolli di rete. Allo stesso tempo, uno stesso protocollo può essere coinvolto in test differenti.
L'idea è stata quindi quella di non sviluppare un estrattore specifico per ciascun test, ma di organizzare l'estrazione in base ai protocolli supportati.

In questa prima fase, attraverso TShark vengono analizzate le catture e recuperate le informazioni necessarie. Successivamente, i normalizzatori dei diversi protocolli trasformano queste informazioni in eventi strutturati, organizzati in una rappresentazione che il sistema può elaborare.
Si ottiene così un insieme di eventi che rappresenta le informazioni rilevanti per i protocolli analizzati, indipendentemente dal singolo test che verrà verificato.

I colori sono una rappresentazione concettuale dei protocolli. La selezione dei protocolli viene dalla configurazione del test. I normalizzatori sono riutilizzabili per protocollo; la selezione del singolo criterio è guidata dalla DSL. In questo esempio PFCP non è richiesto. L’output è denominato Evidenze selezionate, come l’input della slide successiva.

La rappresentazione è concettuale. Il terzo riquadro identifica lo stesso output che costituisce l’input della slide 7: Evidenze selezionate.

I colori identificano i protocolli. Le linee sotto la cattura collegano un singolo pacchetto alla rispettiva etichetta. Lo schema è concettuale; la configurazione illustrata seleziona NAS e HTTP/2.

PFCP rimane visibile nella cattura originale. Nella colonna degli eventi strutturati è sbiadito perché la configurazione illustrata seleziona soltanto NAS e HTTP/2.

Fonte tecnica: Bozza_Tesi_DeSantis_Samuele(1).pdf, §4.2–4.5.
Durata indicativa: 60 secondi.</template>

          <template class="speaker-note">Questo insieme può però contenere ancora molte più informazioni di quelle necessarie per il caso SCAS specifico, ed è qui che interviene la seconda fase, cioè la selezione delle evidenze guidata dalla DSL.

Per capire questo passaggio, è importante precisare che il linguaggio è organizzato in due blocchi principali: 
- un blocco dedicato alla selezione delle evidenze 
- e un blocco dedicato alla definizione dei criteri di verifica.

Il PRIMO permette di specificare quali eventi individuare all'interno delle informazioni normalizzate e come metterli in relazione tra loro. Possiamo, per esempio, richiedere una determinata sequenza di messaggi oppure raccogliere una collezione di eventi dello stesso tipo.
- In questo modo si passa da un insieme generale di eventi strutturati a un insieme di evidenze specifiche per il test, sulle quali sarà possibile applicare le verifiche richieste.

Una volta individuate queste evidenze, entra in gioco il SECONDO BLOCCO della DSL, che definisce quali proprietà devono essere verificate.
Il sistema supporta due modalità principali di verifica.
- La prima è la verifica statica, che permette di controllare condizioni sui valori osservati, sulla presenza di determinate informazioni o sulle relazioni tra campi appartenenti a eventi differenti.
	
- La seconda è la verifica temporale, che permette di controllare proprietà legate al tempo, come la necessità che un determinato evento si verifichi, oppure non si verifichi, entro un intervallo prestabilito.

Queste modalità permettono di affrontare criteri di verifica differenti e vengono utilizzate in base alle esigenze del test, senza che sia sempre necessario applicarle entrambe.

Infine, i risultati vengono raccolti in un report strutturato, che prevede tre possibili verdetti: 
- PASS, quando i criteri risultano soddisfatti; 
- FAIL, quando viene rilevata una violazione; 
- e INCONCLUSIVE, quando le evidenze disponibili non consentono di arrivare a una conclusione.
	- Quest'ultimo esito è particolarmente importante, perché distingue un criterio effettivamente violato da una situazione in cui non disponiamo di informazioni sufficienti per valutarlo.

Il report documenta, oltre al verdetto, anche i criteri applicati, i valori osservati, i riferimenti ai frame della cattura e le motivazioni che hanno portato al verdetto.

Sono presenti anche alcuni metadati utili alla tracciabilità e alla riproducibilità della verifica, come l'identificazione delle catture attraverso un hash SHA-256 e la versione degli strumenti utilizzati per l'estrazione.

In questo modo il report permette non soltanto di comprendere il risultato, ma anche di ricostruire su quali dati e con quali strumenti è stata eseguita la verifica.

I frammenti mantengono nomi, valori e gerarchia dei campi del report originale di GitHub. Alcuni campi sono omessi per leggibilità. L’hash nel file JSON è completo; non sono aggiunti campi sintetici.

L’estratto è un singolo oggetto JSON valido: mantiene il contenuto del report originale, omette gli altri campi e rimuove le virgole finali del frammento proposto in chat. L’hash è abbreviato visivamente con un’ellissi. Il valore completo resta in data/upf-report-excerpt.json.

Fonte del report: reports/upf_teid_uniqueness/report.json, branch refactor/generic-pipeline. I campi mostrati sono estratti da sezioni diverse del report. L’hash è abbreviato.

Fonte tecnica: Bozza_Tesi_DeSantis_Samuele(1).pdf, §4.6–4.7 e report UPF.

          <template class="speaker-note">Come abbiamo visto, la DSL è organizzata in due blocchi principali: uno dedicato alla selezione delle evidenze e uno alla definizione dei criteri di verifica.

Per rappresentare questi due aspetti è stata progettata una sintassi specifica, descritta attraverso una grammatica che stabilisce come devono essere scritte le regole.

Queste vengono poi analizzate attraverso un parser realizzato con Lark, una libreria Python, che permette di trasformare le istruzioni della DSL in una rappresentazione strutturata, successivamente utilizzata dai componenti del sistema.




La selezione e il confronto sono l’esempio del §5.2. La formula è l’esempio AMF Case B del §6.3.1. Sono frammenti di esempi distinti, mostrati per illustrare i due blocchi della DSL.

Questa slide integra i costrutti di selezione della precedente slide 9. Gli estratti provengono da test diversi: selezione e confronto RAND dalla famiglia RES*, formula MFOTL dal caso AMF B. I puntini indicano parti omesse e non sono sintassi DSL.

Parte del discorso sulla selezione:
Partendo dal primo blocco, quello di selezione, il linguaggio prevede tre costrutti principali: SEQUENCE, OPTIONAL e COLLECT.

Il primo, SEQUENCE, permette di descrivere una successione di eventi che vogliamo individuare all'interno del traffico normalizzato. Per ogni evento possiamo specificare anche un alias, che servirà successivamente per accedere alle informazioni estratte.

All'interno di una sequenza possiamo inoltre inserire dei blocchi OPTIONAL, che rappresentano eventi la cui presenza non è obbligatoria per il riconoscimento della sequenza. Questo è particolarmente utile quando vogliamo rappresentare, attraverso una stessa regola, comportamenti che possono presentare delle variazioni.

Il terzo costrutto è COLLECT, che viene invece utilizzato quando non siamo interessati a ricostruire una sequenza di messaggi, ma vogliamo raccogliere una collezione di eventi dello stesso tipo, sui quali applicare successivamente delle verifiche.

Fonte tecnica: Bozza_Tesi_DeSantis_Samuele(1).pdf, §5.1–5.3, §5.7; §5.2 e §6.3.3.
Durata indicativa: 85 secondi.</template>

          <template class="speaker-note">Uno degli aspetti implementativi più interessanti riguarda proprio il riconoscimento delle sequenze descritte tramite SEQUENCE.

Infatti, una volta ottenuti gli eventi normalizzati, il sistema deve riuscire a individuare al loro interno le successioni di messaggi che corrispondono alla regola DSL, anche quando sono presenti eventi non pertinenti.

Per affrontare questo problema è stato realizzato un matcher basato su automi a stati finiti non deterministici, o NFA, la cui costruzione è ispirata all'algoritmo di Thompson.

L'idea è partire dalla sequenza descritta nella DSL e costruire, per ciascun evento richiesto, un elemento base dell'automa, chiamato _atom_. Ogni atom presenta uno stato iniziale, uno stato finale e una transizione associata all'evento che vogliamo riconoscere.

Questi elementi vengono poi collegati per costruire l'automa complessivo, che rappresenta i possibili percorsi di riconoscimento della sequenza.


Prendiamo, per esempio, una sequenza composta da tre eventi: A, B e C, dove A e C sono obbligatori, mentre B è opzionale.
- L'automa deve quindi essere in grado di riconoscere sia la sequenza A, B, C, sia la sequenza A, C.

Per ottenere questo comportamento vengono utilizzate due tipologie di transizioni.
1. Le prime sono le transizioni che consumano un evento, cioè quelle che permettono di avanzare quando viene riconosciuto il messaggio atteso.
	
2. Le seconde sono le cosiddette transizioni epsilon, che consentono di passare da uno stato all'altro senza consumare alcun evento.
	Nel nostro caso, queste transizioni possono essere utilizzate sia per collegare i diversi elementi dell'automa, sia per rappresentare la possibilità di saltare un blocco opzionale.

Nell'esempio, quindi, oltre al percorso che attraversa l'evento B, viene previsto anche un percorso alternativo che permette di raggiungere C senza dover necessariamente riconoscere B.

Ogni atom contiene il tipo di evento e l’alias. La compilazione Thompson aggiunge le transizioni ε e il ramo che salta OPTIONAL. Lo stesso automa accetta A B C oppure A C.

Spiegazione manuale: dalla regola crea Atom A, Atom B e Atom C. Dispongo i tre atomi nell’automa e solo dopo aggiungo ε tra atomi e il salto facoltativo di B. Gli atomi elementari non contengono ε e non mostrano q5 finale. Solo l’automa completo ha q5 finale. Il pulsante Spiega per passi abilita la progressione manuale.

Verifica della notazione: la freccia esterna senza origine è un indicatore grafico dello stato iniziale, non una transizione dell’NFA. La ometto dai frammenti e dal diagramma completo. q0 è esplicitamente indicato come inizio. Le vere transizioni che consumano a, b, c e le ε restano rappresentate. Fonte primaria di implementazione: Russ Cox, Regular Expression Matching Can Be Simple And Fast, https://swtch.com/~rsc/regexp/regexp1.html.

Fonte tecnica: Bozza_Tesi_DeSantis_Samuele(1).pdf, §5.4.
Durata indicativa: 85 secondi.</template>

          <template class="speaker-note">Una volta costruito l'automa, il matcher scorre gli eventi normalizzati e cerca di riconoscere i percorsi descritti dalla regola, individuando le sequenze che soddisfano la struttura richiesta.


È stata inoltre prevista una politica di restart: quando viene incontrato un evento compatibile con l'inizio della sequenza, il matcher può avviare un nuovo tentativo di riconoscimento senza interrompere necessariamente quelli già in corso. In questo modo può considerare più possibili punti di partenza all'interno della stessa cattura, senza dipendere esclusivamente dalla prima occorrenza dell'evento iniziale.

Il pattern qui è A OPTIONAL(B) C, con B presente nel match mostrato. Le posizioni 3, 4, 6 sono indici illustrativi, non frame di una cattura sperimentale. Il primo A rimane neutro.

          <template class="speaker-note">Una volta riconosciuta una sequenza, oppure raccolti gli eventi attraverso COLLECT, queste informazioni devono essere rese accessibili alle regole di verifica.

Per questo viene utilizzata una struttura chiamata binding context, che permette di associare gli eventi selezionati agli alias definiti nella DSL.

In questo modo, ogni elemento individuato può essere richiamato attraverso un riferimento e il verificatore può accedere ai suoi campi.

Il binding context rappresenta quindi il collegamento tra i due blocchi del linguaggio: la selezione individua le evidenze rilevanti, mentre il binding context le rende utilizzabili dalle regole di verifica.




Fonti del codice: matcher/models.py e traffic/models.py, ramo refactor/generic-pipeline. BindingValue è MessageEvent | list[MessageEvent] | dict[str, Any]. Match.to_binding_context() restituisce BindingContext(bindings=dict(self.bindings)). Sequence pipeline aggiorna inoltre context.bindings con i binding esterni, configurativi e derivati. I valori visualizzati dell’evento sono quelli del report AMF Case B; frame_number è il nome dell’attributo del modello, mentre il reporter lo serializza come frame. Il frammento del metodo omette le annotazioni di tipo, senza alterarne il corpo.

Estratto di reports/amf_sync_failure_case_b/report.json. sync_failure è il messaggio NAS Authentication Failure, causa 21 (Synchronization Failure), frame 358. Il report serializza frame_number come frame. Mostro due binding e ometto gli altri campi del contesto.

Nella slide, il Match produce il BindingContext. Il contesto contiene i binding, cioè alias associati agli eventi selezionati. Il dettaglio a destra espande soltanto sync_failure, contenuto nel contesto. Il precedente riquadro separato Authentication Failure è stato eliminato. Tutti i valori dell’estratto provengono dal report AMF Case B.

Il contenitore mette in relazione alias ed evento selezionato. La riga sync_failure è evidenziata e collegata al relativo dettaglio reale. I tre puntini verticali indicano gli altri binding omessi.

Match e BindingContext sono allineati. Le due linee grigie ingrandiscono il contenuto del contesto; la linea con due punti espande la riga sync_failure nel suo dettaglio. Non indica una trasformazione del dato.

Fonte tecnica: Bozza_Tesi_DeSantis_Samuele(1).pdf, §5.5–5.6, §6.3.1.

          <template class="speaker-note">Una volta che gli eventi sono stati selezionati e resi disponibili attraverso il binding context, possiamo applicare i criteri di verifica definiti nel secondo blocco della DSL.

Per esprimere questi criteri viene utilizzato principalmente il costrutto REQUIRE, che permette di controllare proprietà sui dati osservati. Possiamo, ad esempio, confrontare valori appartenenti a eventi differenti oppure verificare che una determinata informazione sia presente.

Quando invece la selezione produce una collezione di eventi, come nel caso di COLLECT, possiamo applicare condizioni sull'intera collezione. È il caso di REQUIRE UNIQUE, che permette di verificare l'unicità dei valori di un determinato campo.

Infine, attraverso IF, possiamo rendere alcune verifiche condizionali, ad esempio quando la presenza di eventi opzionali determina quali proprietà debbano essere controllate.
- Questo può essere particolarmente utile in combinazione con OPTIONAL: se una parte della sequenza può essere presente oppure assente, anche le condizioni da verificare possono dipendere dagli eventi che sono stati effettivamente riconosciuti.

Oltre alle verifiche statiche, il sistema permette anche di esprimere e valutare proprietà temporali.

Per rappresentare queste proprietà è stata utilizzata la Metric First-Order Temporal Logic, o MFOTL, un formalismo logico che consente di descrivere condizioni sugli eventi tenendo conto anche di intervalli temporali. Per valutare queste formule viene invece utilizzato MonPoly, un motore di verifica temporale esterno che è stato integrato nella pipeline.

Il sistema si occupa quindi di predisporre la formula e gli eventi temporizzati nel formato richiesto da MonPoly, che esegue la verifica della proprietà.


Per esempio, possiamo esprimere una proprietà secondo cui, dopo un determinato evento, un altro evento non deve verificarsi entro un intervallo di tempo prestabilito.

Fonte tecnica: Bozza_Tesi_DeSantis_Samuele(1).pdf, §5.6–5.8.
Durata indicativa: 75 secondi.</template>

          <template class="speaker-note">Per valutare la soluzione proposta sono stati considerati diversi casi di test SCAS, che hanno guidato anche lo sviluppo e il perfezionamento dei meccanismi della DSL e della pipeline.

Tra questi, vorrei soffermarmi su tre esempi particolarmente rappresentativi, perché permettono di mostrare modalità differenti di selezione delle evidenze e di verifica delle proprietà.

Il primo esempio riguarda il test AMF Synchronization Failure, Case B, che è particolarmente interessante perché combina il riconoscimento di una sequenza di messaggi con verifiche sia statiche sia temporali.

Il test riguarda la gestione di un errore di sincronizzazione durante la procedura di autenticazione. In particolare, dopo aver ricevuto un messaggio di _Synchronization Failure_, l'AMF deve gestire la procedura di risincronizzazione secondo il comportamento previsto dalla specifica.


Attraverso SEQUENCE vengono individuati i messaggi che compongono la procedura, mentre le condizioni REQUIRE permettono di verificare le informazioni osservate, tra cui la presenza dei parametri necessari alla risincronizzazione e la corrispondenza dei relativi valori.

A questi controlli si aggiunge una proprietà temporale, espressa attraverso MFOTL, che verifica che non venga osservato un nuovo _Authentication Request_ nell'intervallo temporale considerato dopo l'errore di sincronizzazione.

Nel caso analizzato, il sistema ha riconosciuto la sequenza richiesta e le verifiche statiche e temporali hanno restituito un esito positivo, producendo quindi un verdetto complessivo PASS.

Questo esempio mostra come una stessa regola DSL possa combinare la selezione di una sequenza con criteri di verifica di natura diversa.

La timeline è proporzionata: T3520 è 15 secondi, mentre il delta tra i timestamp originali dei frame 358 e 606 è 25.017797 secondi. Nessuna richiesta è osservata entro l’intervallo vietato. La formula è quella della DSL Case B. I quattro criteri statici confrontano RAND iniziale/vettore, causa 21, AUTS resync/failure e RAND resync/initial_auth.

Selezione e REQUIRE: dsl/amf_sync_failure_case_b_sequence.dsl. Proprietà MFOTL: dsl/amf_sync_failure.dsl, CASE B. Qui compongo le due parti per mostrarle insieme. MonPoly valuta NOT EVENTUALLY nella finestra 0–15000 ms. Differenza reale tra frame 358 e 606: 25.017797 secondi, dunque nessuna nuova richiesta nel periodo vietato.

La regola rimane completa. Il verdetto complessivo combina i quattro criteri statici e il criterio temporale valutato da MonPoly. La frase entro 15 s indica l’intervallo in cui una nuova Authentication Request è vietata. Il richiamo verde collega il frame 606 al punto osservato nella timeline, 25.017797 s dopo il frame 358.

Il riquadro della regola conserva tutte le sei selezioni, le quattro REQUIRE e la formula MFOTL. TIMER_MS è ricavato da T3520, pari a 15 secondi, e convertito in millisecondi per la formula. Il collegamento dal controllo temporale porta alla spiegazione del PASS: tra il frame 358 e il 606 trascorrono 25.017797 secondi.

Fonte tecnica: Bozza_Tesi_DeSantis_Samuele(1).pdf, §6.3.1.

          <template class="speaker-note">La matrice 2×2 originale è conservata. I quattro casi hanno un match completo ciascuno e verdetto PASS. I due assi sono percorso di identificazione (SUCI diretto oppure GUTI → SUCI) e origine del fallimento (AMF oppure AUSF). Gli IF dipendono anche da case.identity_path e case.failure_source. SKIPPED indica un criterio non applicabile.

Il terzo esempio riguarda una famiglia di test più articolata: AMF RES* Verification Failure, composta dai casi A, B, C e D.

Questo esempio permette di mostrare soprattutto la flessibilità del linguaggio, perché i quattro casi presentano alcune parti della procedura in comune, ma anche differenze nei messaggi osservati e nelle condizioni da verificare.


L'idea è stata quindi quella di rappresentare questa famiglia attraverso un'unica regola DSL, sfruttando proprio le caratteristiche dei costrutti di selezione e verifica.

Attraverso SEQUENCE viene descritta la struttura generale della procedura, mentre OPTIONAL permette di rappresentare parti della sequenza che possono essere presenti soltanto in determinati casi.

A livello di verifica, invece, il costrutto IF consente di applicare condizioni differenti in funzione delle evidenze effettivamente riconosciute.

In questo modo, una stessa regola può rappresentare più varianti della procedura, senza dover definire una logica di verifica completamente separata per ciascun caso.

Per quanto riguarda i risultati, il sistema ha individuato un unico match completo in ciascuna delle quattro catture, riconoscendo correttamente i diversi gruppi di eventi opzionali.

Tutte e quattro le varianti hanno prodotto un verdetto complessivo PASS, ma con un numero diverso di criteri soddisfatti: 7 nel caso A, 9 nei casi B e C e 11 nel caso D.

Inoltre, in ogni variante, due condizioni non applicabili sono state contrassegnate come SKIPPED, senza eseguire le verifiche contenute al loro interno.

Questo risultato mostra come un'unica specifica DSL possa gestire percorsi differenti, applicando soltanto i criteri pertinenti al caso considerato.

La matrice mette in relazione i due assi indipendenti: identificazione SUCI diretto o GUTI→SUCI e fallimento locale AMF o AUSF. A e B condividono il fallimento locale; A e C l’identificazione SUCI; B e D il percorso GUTI→SUCI; C e D il fallimento AUSF. Gli IF utilizzano anche binding di configurazione. I conteggi PASS includono gli IF soddisfatti.

L’estratto mostra veri IF del file dsl/resstar_verification_failure.dsl. I confronti lunghi sono spezzati graficamente. I puntini indicano istruzioni omesse; non sono sintassi DSL. Sono omessi gli altri criteri comuni e il ramo guti_then_suci.

L’estratto mantiene l’ordine della regola reale: Authentication Request e Authentication Response sono obbligatori; il successivo gruppo Confirmation è facoltativo; Authentication Reject è obbligatorio. REQUIRE authentication_reject.present vale per tutti i casi. L’IF local applica soltanto il criterio del fallimento locale. La selezione iniziale e gli altri criteri sono omessi.

Precisazione dalla tesi: gli IF utilizzano anche i binding di configurazione case.identity_path e case.failure_source. I criteri PASS includono gli IF soddisfatti.

Fonte tecnica: Bozza_Tesi_DeSantis_Samuele(1).pdf, §6.3.3.
Durata indicativa: 75 secondi.</template>

          <template class="speaker-note">Un'altra componente importante della valutazione sperimentale è stata il mutation testing.

Durante lo sviluppo, infatti, il linguaggio e la pipeline sono stati realizzati e perfezionati utilizzando casi SCAS specifici, dei quali erano già noti i comportamenti attesi.

Per questo motivo, oltre a verificare che il sistema producesse i risultati corretti sulle catture originali, era importante valutare anche come avrebbe reagito a modifiche controllate delle evidenze.

L'idea è stata quindi quella di partire da una cattura originale, individuare le informazioni rilevanti per il test e introdurre delle mutazioni direttamente nel traffico acquisito.

I riferimenti ai frame presenti nelle evidenze e nei report permettono di identificare gli elementi della cattura sui quali intervenire.

La cattura modificata viene poi passata nuovamente alla stessa pipeline, utilizzando le stesse regole DSL, così da confrontare il nuovo risultato con quello ottenuto dalla cattura originale.

La mutazione è offline. I pacchetti modificati non vengono reinviati alle Network Function: questi esperimenti valutano il comportamento della pipeline.

Fonte tecnica: Bozza_Tesi_DeSantis_Samuele(1).pdf, §6.4.
Durata indicativa: 60 secondi.</template>

          <template class="speaker-note">Sono state realizzate diverse tipologie di mutazione, per un totale di 15 esperimenti, in modo da valutare il comportamento del sistema in situazioni differenti.
1. Una prima categoria riguarda le mutazioni statiche, nelle quali vengono modificati valori o campi utilizzati dalle condizioni di verifica.
	
2. Una seconda categoria riguarda le mutazioni temporali, nelle quali vengono alterati gli intervalli di tempo tra gli eventi, per verificare se il sistema rileva la violazione di una proprietà temporale.
	Nei casi che prevedono entrambe le modalità di verifica, come quelli di AMF Synchronization Failure, sono state considerate anche mutazioni che alterano separatamente le proprietà statiche e temporali, oppure entrambe.
	Questo permette di osservare se il verificatore rileva correttamente una violazione anche quando le altre condizioni continuano a essere soddisfatte.
	
3. Un'ulteriore tipologia di mutazione è stata progettata per valutare il verdetto INCONCLUSIVE.
	Per esempio, nel caso UPF TEID Uniqueness, sono stati rimossi dalla cattura gli eventi necessari a costruire la collezione di F-TEID. In questo modo, il sistema non dispone più delle evidenze sufficienti per valutare il criterio e restituisce INCONCLUSIVE, anziché considerare automaticamente il test fallito.

Il punto fondamentale di questi esperimenti è che la DSL e la logica di verifica rimangono invariate: cambiano soltanto le evidenze fornite in ingresso.

Il confronto tra i risultati permette quindi di valutare se il sistema riconosce le alterazioni introdotte e se restituisce un verdetto coerente con le proprietà effettivamente osservate.

Chiusura orale prima della slide finale:
I risultati ottenuti, anche attraverso il mutation testing, mostrano quindi come sia possibile valutare il comportamento osservato durante un test non soltanto in base al suo esito, ma anche alla capacità di individuare le condizioni che lo hanno determinato.

È importante però considerare che questa valutazione dipende dalle evidenze effettivamente disponibili e dai criteri che siamo in grado di rappresentare. Il sistema, infatti, è stato sviluppato e sperimentato su un insieme specifico di casi SCAS e non può ancora essere considerato una soluzione generale per qualsiasi procedura di test.

Proprio da questi limiti emergono possibili sviluppi futuri, come l'estensione del linguaggio a nuove tipologie di criteri, il supporto a ulteriori protocolli e una valutazione su un insieme più ampio di casi, anche più complessi.

In questa prospettiva, il contributo del lavoro non consiste nel sostituire l'analisi della sicurezza con un verdetto automatico, ma nel rendere la verifica un processo più sistematico, in cui le conclusioni possano essere ricostruite, motivate e ricondotte alle evidenze da cui derivano.

Conclusione: la prova tramite mutazione non estende automaticamente la portata dei criteri implementati, ma aiuta a controllare la loro reazione. La direzione futura è ampliare i criteri, i protocolli e la valutazione, rendendo espliciti i limiti dell’evidenza disponibile.

Fonte tecnica: Bozza_Tesi_DeSantis_Samuele(1).pdf, §6.4.
Durata indicativa: 50 secondi.</template>
