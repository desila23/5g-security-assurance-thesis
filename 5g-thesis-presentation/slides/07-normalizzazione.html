  <template class="speaker-note">La PCAP contiene molti pacchetti. TShark estrae i dati relativi ai protocolli selezionati; i normalizzatori li organizzano in MessageEvent. I resolver intervengono quando serve ricostruire il significato degli eventi. Il riquadro inferiore mostra la struttura comune: numero di frame e timestamp, protocollo e tipo, estremi della comunicazione, message_type, riferimenti ai frame, correlazioni e campi specifici. La DSL seleziona le evidenze rilevanti. La slide successiva riparte dalle evidenze selezionate e mostra verifica, verdetto e report.</template>
