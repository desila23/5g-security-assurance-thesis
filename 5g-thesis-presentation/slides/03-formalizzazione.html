<text x="1488" y="92" font-family="Nimbus Sans" font-size="18" font-weight="400" fill="#52627b" text-anchor="end">{{NN}} / {{TOTAL}}</text>
<text x="112" y="167" font-family="Nimbus Sans" font-size="54" font-weight="700" fill="#182536" text-anchor="start">Da human-readable a machine-readable</text>
<text x="112" y="222" font-family="Nimbus Sans" font-size="27" font-weight="400" fill="#52627b" text-anchor="start">Come può un sistema software sapere quali messaggi cercare, quali informazioni confrontare</text>
<text x="112" y="262" font-family="Nimbus Sans" font-size="27" font-weight="400" fill="#52627b" text-anchor="start">e quali condizioni verificare, se le NF sono componenti software e le SCAS sono scritte in linguaggio naturale?</text>
<rect x="112" y="380" width="418" height="220" rx="13" fill="#ffffff" stroke="#d9e3ef" stroke-width="1.8"/>
<text x="321" y="474" font-family="Nimbus Sans" font-size="36" font-weight="700" fill="#182536" text-anchor="middle">SCAS</text>
<text x="321" y="520" font-family="Nimbus Sans" font-size="24" font-weight="400" fill="#52627b" text-anchor="middle">Specifica human-readable</text>
<path d="M542 490 H574" fill="none" stroke="#4264d0" stroke-width="2.4" marker-end="url(#intro-arrow-{{N}})"/>
<rect x="590" y="380" width="352" height="220" rx="13" fill="#f0f4ff" stroke="#d9e3ef" stroke-width="1.8"/>
<text x="766" y="474" font-family="Nimbus Sans" font-size="29" font-weight="700" fill="#4264d0" text-anchor="middle">Formalizzazione</text>
<text x="766" y="517" font-family="Nimbus Sans" font-size="29" font-weight="700" fill="#4264d0" text-anchor="middle">dei criteri</text>
<path d="M954 490 H986" fill="none" stroke="#4264d0" stroke-width="2.4" marker-end="url(#intro-arrow-{{N}})"/>
<rect x="1002" y="380" width="486" height="220" rx="13" fill="#eef8f3" stroke="#c4dfd3" stroke-width="1.8"/>
<text x="1245" y="474" font-family="Nimbus Sans" font-size="31" font-weight="700" fill="#278766" text-anchor="middle">Regole machine-readable</text>
<text x="1245" y="520" font-family="Nimbus Sans" font-size="24" font-weight="400" fill="#52627b" text-anchor="middle">Struttura interpretabile dal software</text>
<text x="112" y="737" font-family="Nimbus Sans" font-size="23" font-weight="400" fill="#52627b" text-anchor="start">La formalizzazione è affidata al progettista. Il software applica in automatico le regole alle evidenze.</text>

<template class="speaker-note">Le NF sono componenti software, mentre le SCAS sono scritte in linguaggio naturale. Come può il sistema sapere quali messaggi cercare, quali informazioni confrontare e quali condizioni verificare? Serve una rappresentazione strutturata dei criteri. La formalizzazione è del progettista; il software applica automaticamente le regole alle evidenze. La traduzione SCAS → DSL non è automatica.</template>
