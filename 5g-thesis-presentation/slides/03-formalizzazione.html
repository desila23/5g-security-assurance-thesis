<text x="112" y="867" font-family="Nimbus Sans" font-size="23" font-weight="400" fill="#52627b" text-anchor="start">La formalizzazione è del progettista. Il software applica le regole alle evidenze.</text>

<template class="speaker-note">Le Network Functions sono prevalentemente software, mentre le SCAS sono scritte in linguaggio naturale. Come può il programma sapere quali messaggi cercare, quali campi confrontare e quali condizioni verificare? Serve una rappresentazione strutturata. Il progettista interpreta i criteri e li formalizza: la traduzione SCAS → DSL non è automatica. Il breve esempio concettuale richiama il test NRF: selezionare richiesta e risposta, poi controllare lo status 403. OpenAPI è soltanto un’analogia nel dominio delle API, non è il linguaggio del progetto e non esegue test SCAS. La domanda prepara il motore comune e la DSL delle prossime due slide.</template>
