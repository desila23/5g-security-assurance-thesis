  <text x="141" y="342" font-family="Nimbus Sans" font-size="23" font-weight="700" fill="#4264d0" text-anchor="start" xml:space="preserve">SELEZIONE</text><text x="141" y="401" font-family="DejaVu Sans Mono" font-size="29" font-weight="400" fill="#182536" text-anchor="start" xml:space="preserve">SEQUENCE {</text><text x="141" y="447" font-family="DejaVu Sans Mono" font-size="29" font-weight="400" fill="#182536" text-anchor="start" xml:space="preserve">    nrf.discovery.request AS request</text><text x="141" y="493" font-family="DejaVu Sans Mono" font-size="29" font-weight="400" fill="#182536" text-anchor="start" xml:space="preserve">    nrf.discovery.response AS response</text><text x="141" y="539" font-family="DejaVu Sans Mono" font-size="29" font-weight="400" fill="#182536" text-anchor="start" xml:space="preserve">}</text><text x="141" y="660" font-family="Nimbus Sans" font-size="23" font-weight="700" fill="#278766" text-anchor="start" xml:space="preserve">VERIFICA</text><text x="141" y="730" font-family="DejaVu Sans Mono" font-size="29" font-weight="400" fill="#182536" text-anchor="start" xml:space="preserve">REQUIRE response.status == 403</text><text x="1060" y="342" font-family="Nimbus Sans" font-size="27" font-weight="700" fill="#4264d0" text-anchor="start" xml:space="preserve">Costrutti disponibili</text><text x="1060" y="397" font-family="Nimbus Sans" font-size="20" font-weight="700" fill="#4264d0" text-anchor="start" xml:space="preserve">SEQUENCE</text><text x="1195" y="397" font-family="Nimbus Sans" font-size="21" font-weight="400" fill="#182536" text-anchor="start" xml:space="preserve">Messaggi in ordine</text><text x="1060" y="449" font-family="Nimbus Sans" font-size="20" font-weight="700" fill="#4264d0" text-anchor="start" xml:space="preserve">OPTIONAL</text><text x="1195" y="449" font-family="Nimbus Sans" font-size="21" font-weight="400" fill="#182536" text-anchor="start" xml:space="preserve">Gruppo facoltativo</text><text x="1060" y="501" font-family="Nimbus Sans" font-size="20" font-weight="700" fill="#4264d0" text-anchor="start" xml:space="preserve">COLLECT</text><text x="1195" y="501" font-family="Nimbus Sans" font-size="21" font-weight="400" fill="#182536" text-anchor="start" xml:space="preserve">Eventi dello stesso tipo</text><text x="1060" y="660" font-family="Nimbus Sans" font-size="27" font-weight="700" fill="#278766" text-anchor="start" xml:space="preserve">Costrutti disponibili</text><text x="1060" y="697" font-family="Nimbus Sans" font-size="19" font-weight="700" fill="#278766" text-anchor="start" xml:space="preserve">REQUIRE</text><text x="1250" y="697" font-family="Nimbus Sans" font-size="21" font-weight="400" fill="#182536" text-anchor="start" xml:space="preserve">Vincoli sui valori</text><text x="1060" y="731" font-family="Nimbus Sans" font-size="19" font-weight="700" fill="#278766" text-anchor="start" xml:space="preserve">REQUIRE UNIQUE</text><text x="1250" y="731" font-family="Nimbus Sans" font-size="21" font-weight="400" fill="#182536" text-anchor="start" xml:space="preserve">Valori distinti</text><text x="1060" y="765" font-family="Nimbus Sans" font-size="19" font-weight="700" fill="#278766" text-anchor="start" xml:space="preserve">MFOTL</text><text x="1250" y="765" font-family="Nimbus Sans" font-size="21" font-weight="400" fill="#182536" text-anchor="start" xml:space="preserve">Proprietà temporali</text>

  <template class="speaker-note">La DSL ha due blocchi. Selezione: SEQUENCE per successioni ordinate, OPTIONAL per eventi facoltativi e COLLECT per eventi dello stesso tipo. Gli alias permettono di richiamare eventi e collezioni. Verifica: REQUIRE e UNIQUE per controlli statici, MFOTL per proprietà temporali. L’esempio NRF collega richiesta, risposta e status atteso 403.</template>
