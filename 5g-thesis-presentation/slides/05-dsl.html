<template class="speaker-note">Come possiamo rendere espliciti i criteri di un test SCAS, invece di riscrivere la logica per ogni verifica? Per introdurre l&#x27;idea guardiamo prima un esempio che appartiene a un altro dominio: OpenAPI. La sua specifica YAML permette di descrivere in forma strutturata le interfacce di un&#x27;API, per esempio percorso, metodo e risposta. OpenAPI non è il linguaggio sviluppato in questa tesi e il frammento non descrive un test di sicurezza: serve solo a mostrare il vantaggio di una descrizione formale interpretabile da strumenti software. Nel nostro dominio proponiamo una DSL che formalizza due aspetti: quali eventi del traffico sono evidenze pertinenti al test e quali criteri verificarvi, inclusi valori e proprietà temporali. La traduzione dei criteri SCAS in DSL è manuale, affidata al progettista; una volta scritta la regola, la pipeline la esegue e produce un risultato motivato.</template>
