<text x="1488" y="92" font-family="Nimbus Sans" font-size="18" font-weight="400" fill="#52627b" text-anchor="end">{{NN}} / {{TOTAL}}</text>
<text x="112" y="167" font-family="Nimbus Sans" font-size="54" font-weight="700" fill="#182536" text-anchor="start">La proposta: una DSL per i test SCAS</text>
<text x="112" y="222" font-family="Nimbus Sans" font-size="27" font-weight="400" fill="#52627b" text-anchor="start">La specifica descrive quali evidenze selezionare e quali criteri verificare.</text>
<rect x="112" y="296" width="1376" height="493" rx="13" fill="#ffffff" stroke="#aac8bd" stroke-width="1.8"/>
<text x="146" y="343" font-family="Nimbus Sans" font-size="20" font-weight="700" fill="#278766" text-anchor="start">IL CONTRIBUTO DELLA TESI</text>
<text x="146" y="393" font-family="Nimbus Sans" font-size="36" font-weight="700" fill="#182536" text-anchor="start">Una DSL, due compiti</text>
<rect x="146" y="430" width="630" height="278" rx="13" fill="#f4f7ff" stroke="#d9e3ef" stroke-width="1.8"/>
<text x="178" y="480" font-family="Nimbus Sans" font-size="27" font-weight="700" fill="#4264d0" text-anchor="start">1 · SELEZIONE DELLE EVIDENZE</text>
<text x="178" y="526" font-family="Nimbus Sans" font-size="27" font-weight="400" fill="#52627b" text-anchor="start">Quali eventi cercare nella cattura,</text>
<text x="178" y="565" font-family="Nimbus Sans" font-size="27" font-weight="400" fill="#52627b" text-anchor="start">in sequenza o in una collezione.</text>
<text x="228" y="641" font-family="Nimbus Sans" font-size="31" font-weight="700" fill="#4264d0" text-anchor="start">A</text>
<path d="M268 631 L332 631" fill="none" stroke="#4264d0" stroke-width="2.4" marker-end="url(#intro-arrow-{{N}})"/>
<text x="362" y="641" font-family="Nimbus Sans" font-size="31" font-weight="700" fill="#4264d0" text-anchor="start">B</text>
<path d="M402 631 L466 631" fill="none" stroke="#4264d0" stroke-width="2.4" marker-end="url(#intro-arrow-{{N}})"/>
<text x="496" y="641" font-family="Nimbus Sans" font-size="31" font-weight="700" fill="#4264d0" text-anchor="start">C</text>
<rect x="808" y="430" width="646" height="278" rx="13" fill="#f0f8f4" stroke="#cae3d7" stroke-width="1.8"/>
<text x="840" y="480" font-family="Nimbus Sans" font-size="27" font-weight="700" fill="#278766" text-anchor="start">2 · VERIFICA DEI CRITERI</text>
<text x="840" y="526" font-family="Nimbus Sans" font-size="27" font-weight="400" fill="#52627b" text-anchor="start">Condizioni sui valori, unicità</text>
<text x="840" y="565" font-family="Nimbus Sans" font-size="27" font-weight="400" fill="#52627b" text-anchor="start">e vincoli temporali.</text>
<text x="840" y="642" font-family="Nimbus Sans" font-size="25" font-weight="700" fill="#278766" text-anchor="start">Valori</text>
<text x="1032" y="642" font-family="Nimbus Sans" font-size="25" font-weight="700" fill="#278766" text-anchor="start">Unicità</text>
<text x="1220" y="642" font-family="Nimbus Sans" font-size="25" font-weight="700" fill="#278766" text-anchor="start">Tempo</text>
<text x="800" y="757" font-family="Nimbus Sans" font-size="29" font-weight="700" fill="#182536" text-anchor="middle">Un’unica DSL, utilizzata da una pipeline comune.</text>
<text x="112" y="852" font-family="Nimbus Sans" font-size="23" font-weight="400" fill="#52627b" text-anchor="start">Il progettista formalizza i criteri SCAS. Il motore interpreta e applica le regole.</text>
</svg>
<template class="speaker-note">Per esprimere le regole ho progettato una Domain-Specific Language. I due compiti sono selezionare le evidenze pertinenti nella cattura e definire le condizioni da verificare: valori, unicità e vincoli temporali. Il progettista interpreta i criteri SCAS e li formalizza nella DSL; il sistema applica automaticamente le regole alle evidenze. Il contributo comprende il linguaggio e una pipeline comune che analizza il traffico, verifica le condizioni e produce un report con verdetto ed evidenze. La grammatica sarà approfondita nella sezione dedicata.</template>
