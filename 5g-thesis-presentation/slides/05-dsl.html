<template class="speaker-note">Il contributo della tesi è una DSL minimale per formalizzare due responsabilità: selezionare nel traffico le evidenze pertinenti e verificare i criteri SCAS, inclusi valori, unicità, condizioni e vincoli temporali. La traduzione dai testi SCAS alla DSL resta manuale; un motore comune esegue le regole sulle evidenze. OpenAPI, nel riquadro secondario a destra, è solo un’analogia da un altro dominio: mostra il valore di una descrizione formale delle interfacce HTTP. La DSL non deriva da OpenAPI.</template>
