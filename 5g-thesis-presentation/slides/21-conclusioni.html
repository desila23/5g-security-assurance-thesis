  <template class="speaker-note">I risultati ottenuti, anche attraverso il mutation testing, mostrano quindi come sia possibile valutare il comportamento osservato durante un test non soltanto in base al suo esito, ma anche alla capacità di individuare le condizioni che lo hanno determinato.
  È importante però considerare che questa valutazione dipende dalle evidenze effettivamente disponibili e dai criteri che siamo in grado di rappresentare. Il sistema, infatti, è stato sviluppato e sperimentato su un insieme specifico di casi SCAS e non può ancora essere considerato una soluzione generale per qualsiasi procedura di test.
  Proprio da questi limiti emergono possibili sviluppi futuri, come l&#x27;estensione del linguaggio a nuove tipologie di criteri, il supporto a ulteriori protocolli e una valutazione su un insieme più ampio di casi, anche più complessi.
  In questa prospettiva, il contributo del lavoro non consiste nel sostituire l&#x27;analisi della sicurezza con un verdetto automatico, ma nel rendere la verifica un processo più sistematico, in cui le conclusioni possano essere ricostruite, motivate e ricondotte alle evidenze da cui derivano.</template>
