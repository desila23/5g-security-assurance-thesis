<template class="speaker-note">I risultati, anche nel mutation testing, collegano i verdetti alle condizioni osservate e alle evidenze che li giustificano. La valutazione dipende però dalle evidenze disponibili e dai criteri rappresentabili: il sistema è stato sperimentato su un insieme specifico di casi SCAS, non su qualsiasi procedura. Due sviluppi futuri: ampliare i test con normalizzatori per nuovi protocolli e nuove evidenze; automatizzare maggiormente il mutation testing usando la DSL per individuare eventi e campi da alterare, riducendo la logica dedicata. Le operazioni concrete restano specifiche dei protocolli. Il contributo rende la verifica un processo più sistematico, con conclusioni ricostruibili, motivate e riconducibili alle evidenze. Questa è la conclusione del discorso; segue soltanto la schermata dei ringraziamenti.</template>
