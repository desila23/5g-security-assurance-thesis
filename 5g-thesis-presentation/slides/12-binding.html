  <template class="speaker-note">Il matcher riceve NFA ed eventi normalizzati e produce il Match. Nell’esempio della slide precedente riconosce A(3), B(4), C(6). Nel codice Match contiene start_index, end_index e bindings: una mappa dagli alias agli oggetti MessageEvent. Per la traccia illustrata, gli indici Python sono 2 e 5, corrispondenti alle posizioni 3 e 6 della numerazione da 1 usata nel disegno. I binding sono a → evento A in posizione 3, b → evento B in posizione 4, c → evento C in posizione 6. to_binding_context() crea un nuovo dizionario con le stesse associazioni e gli stessi oggetti evento; non ne trasforma i campi e non porta gli indici nel BindingContext. I numeri indicano posizioni nell’esempio, non frame reali. event.a, event.b ed event.c sono tipi didattici. Nel close-up vediamo gli oggetti MessageEvent riferiti dai tre alias.</template>
